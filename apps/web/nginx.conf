server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /health {
        proxy_pass http://api:8080/health;
    }

    location /ready {
        proxy_pass http://api:8080/ready;
    }

    location /jobs {
        proxy_pass http://api:8080/jobs;
    }
}
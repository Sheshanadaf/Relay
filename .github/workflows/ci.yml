name: ci

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out git
              uses: actions/checkout@v4
            - name: Build Image
              run: docker compose build

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3,12"

            - name: Test API /health
              working-directory: apps/api
              run: |
                pip install -r requirments.txt pytest httpx
                pytest -q

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: relay
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Sheshanadaf/Relay.git
    targetRevision: main
    path: charts/relay
  destination:
    server: https://kubernetes.default.svc
    namespace: relay
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true